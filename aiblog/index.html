<!doctype html>
<html lang="en">
<head>
  <title>The Official, Artificial Blog</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Coustard">
  <link rel="icon" href="../images2/blog_favicon.png?v=1">

  <style>
    :root {
      --blue: #0635aa;
      --blue-dark: #042a88;
      --yellow: #fec707;
    }

    body {
      font-family: "Coustard", serif;
      background-color: var(--blue);
      margin: 0;
    }

    /* Top menu back to the main site */
    .site-nav {
      background: var(--blue-dark);
      padding: 0.6rem 1rem;
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .site-nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .site-nav a:hover { color: var(--yellow); }

    /* Banner */
    .blog-banner {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    .blog-banner .mascot {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      border: 5px solid var(--yellow);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .blog-banner h1 {
      color: var(--yellow);
      font-size: 2.4rem;
      margin: 1rem 0 0.25rem;
    }
    .blog-banner a.home-link { color: inherit; text-decoration: none; }
    .blog-banner p {
      color: var(--yellow);
      font-size: 1.1rem;
      margin: 0;
    }

    /* Active tag filter bar */
    .filter-bar {
      max-width: 800px;
      margin: 1rem auto 0;
      color: #fff;
      text-align: center;
    }
    .filter-bar button {
      margin-left: 0.5rem;
      background: var(--yellow);
      color: var(--blue);
      border: none;
      border-radius: 999px;
      padding: 0.15rem 0.8rem;
      font-family: inherit;
      cursor: pointer;
    }

    /* Post cards */
    .posts {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    .post-card {
      background: #fff;
      border-radius: 12px;
      margin: 1.25rem 0;
      padding: 1.5rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .post-card h3 {
      color: var(--blue);
      margin-bottom: 0.25rem;
    }
    .post-meta {
      color: #5a6478;
      font-size: 0.9rem;
      margin-bottom: 0.9rem;
    }
    .post-card p.text { color: #222; }
    .post-card img.post-img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #d5dbe8;
      margin-top: 0.5rem;
    }
    .post-links {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .post-links a {
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .post-links a:hover { background: var(--blue-dark); }

    .tags { margin-top: 1rem; }
    .tag {
      display: inline-block;
      background: var(--yellow);
      color: var(--blue);
      border-radius: 999px;
      padding: 0.15rem 0.75rem;
      margin: 0.2rem 0.3rem 0.2rem 0;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .tag:hover { filter: brightness(0.93); }

    .model-tag {
      display: inline-block;
      background: var(--blue);
      color: #fff;
      border-radius: 999px;
      padding: 0.15rem 0.75rem;
      font-size: 0.85rem;
      text-decoration: none;
      margin-left: 0.4rem;
    }
    .model-tag:hover { background: var(--blue-dark); color: var(--yellow); }
    .prompt-box {
      background: #0f1b3d;
      color: #c8f7c5;
      font-family: "Courier New", monospace;
      font-size: 0.9rem;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      margin: 0.75rem 0;
      white-space: pre-wrap;
    }
    .prompt-box .label {
      display: block;
      color: var(--yellow);
      font-family: "Coustard", serif;
      font-size: 0.8rem;
      margin-bottom: 0.35rem;
      letter-spacing: 0.04em;
    }
    .quote {
      border-left: 4px solid var(--yellow);
      padding: 0.25rem 0 0.25rem 0.9rem;
      margin: 0.75rem 0;
      color: #333;
      font-style: italic;
    }
    .empty {
      color: #fff;
      text-align: center;
      margin: 2rem 0;
    }

    footer {
      text-align: center;
      color: #fff;
      padding: 2rem 0;
    }
    .footer-image {
      width: 158px;
      max-width: 80%;
      border-radius: 8px;
    }

    @media (max-width: 576px) {
      .blog-banner h1 { font-size: 1.8rem; }
      .blog-banner .mascot { width: 180px; height: 180px; }
      .post-card { padding: 1.1rem; }
    }
  </style>
</head>

<body>
  <nav class="site-nav">
    <a href="/">Home</a>
    <a href="/introAI">Intro to AI</a>
    <a href="/apCSP">AP CSP</a>
    <a href="/apCSA">AP CSA</a>
    <a href="/contact">Contact</a>
  </nav>

  <header class="blog-banner">
    <a href="/aiblog/" class="home-link">
      <img src="../images2/blog_dragon.png?v=2" alt="Blog mascot: a baby dragon" class="mascot">
      <h1>The Official, Artificial Blog</h1>
    </a>
    <p>Studying AI in the STEAM Design Center at SSIS</p>
  </header>

  <div class="filter-bar" id="filter-bar" hidden></div>

  <main class="posts" id="posts"></main>

  <footer>
    <img src="../images2/white_ssis.png" alt="SSIS Logo" class="footer-image">
    <br>
    &copy; <span id="year"></span> J. Farouq
  </footer>

  <script src="posts.js?v=2"></script>
  <script>
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
      "August", "September", "October", "November", "December"];

    function formatDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return `${MONTHS[m - 1]} ${d}, ${y}`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function tagLink(tag) {
      return `<a class="tag" href="#tag=${encodeURIComponent(tag)}">${escapeHtml(tag)}</a>`;
    }

    function renderPost(p) {
      const image = p.image
        ? `<img class="post-img" src="../images2/${encodeURI(p.image)}" alt="${escapeHtml(p.title)}" loading="lazy">`
        : "";
      const links = (p.links || []).length
        ? `<div class="post-links">${p.links.map(l =>
            `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.label)}</a>`).join("")}</div>`
        : "";
      const tags = (p.tags || []).length
        ? `<div class="tags">${p.tags.map(tagLink).join("")}</div>`
        : "";
      return `
        <article class="post-card">
          <h3>${escapeHtml(p.title)}</h3>
          <div class="post-meta">${formatDate(p.date)} &middot; ${escapeHtml(p.credit || "Mr. F")}${p.model ? `<a class="model-tag" href="#tag=${encodeURIComponent(p.model)}">Model: ${escapeHtml(p.model)}</a>` : ""}</div>
          ${p.text ? `<p class="text">${escapeHtml(p.text)}</p>` : ""}
          ${p.prompt ? `<div class="prompt-box"><span class="label">PROMPT</span>${escapeHtml(p.prompt)}</div>` : ""}
          ${p.quote ? `<blockquote class="quote">&ldquo;${escapeHtml(p.quote)}&rdquo;</blockquote>` : ""}
          ${image}
          ${links}
          ${tags}
        </article>`;
    }

    function render() {
      const match = location.hash.match(/^#tag=(.+)$/);
      const tag = match ? decodeURIComponent(match[1]) : null;
      const list = [...POSTS]
        .sort((a, b) => b.date.localeCompare(a.date))
        .filter(p => !tag || (p.tags || []).includes(tag) || p.model === tag);

      const bar = document.getElementById("filter-bar");
      if (tag) {
        bar.hidden = false;
        bar.innerHTML = `Showing posts tagged <strong>${escapeHtml(tag)}</strong>
          <button onclick="location.hash=''">Show all</button>`;
      } else {
        bar.hidden = true;
      }

      document.getElementById("posts").innerHTML = list.length
        ? list.map(renderPost).join("")
        : `<p class="empty">No posts with that tag yet.</p>`;
      window.scrollTo(0, 0);
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
